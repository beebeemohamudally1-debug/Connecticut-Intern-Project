
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ report_title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        @media print {
            button {
                display: none;
            }
        }
    </style>
</head>
<body>

    <h1>{{ report_title }}</h1>
    <p>Total Jobs: {{ total_jobs }}</p>

    <button onclick="window.print()">Print Report</button>

    <table>
        <thead>
            <tr>
                <th>Job ID</th>
                <th>Status</th>
                <th>Assigned Handyman</th>
                <th>Completion Date</th>
            </tr>
        </thead>

        <tbody>
            {% for job in jobs %}
            <tr>
                <td>{{ job.id }}</td>
                <td>{{ job.status }}</td>
                <td>{{ job.handyman }}</td>
                <td>{{ job.completed_at }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">
                    No job records available yet.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
