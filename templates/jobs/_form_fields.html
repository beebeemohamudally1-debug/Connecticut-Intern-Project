{% if form.non_field_errors %}<p class="mut" style="color:var(--red)">{{ form.non_field_errors }}</p>{% endif %}
{% for field in form %}
<div style="margin-bottom:12px">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% for e in field.errors %}<div style="color:var(--red);font-size:13px">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
