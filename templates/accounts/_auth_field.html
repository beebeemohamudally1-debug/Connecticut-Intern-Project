{# include with: id, name, label, type, error, value, autocomplete, placeholder #}
<div class="au-field"><label class="au-label" for="{{ id }}">{{ label }}</label>
<div class="au-ctl{% if type == 'password' %} is-password{% endif %}"><input id="{{ id }}" name="{{ name }}" type="{{ type }}" value="{{ value|default:'' }}" autocomplete="{{ autocomplete }}" placeholder="{{ placeholder }}" aria-describedby="{{ id }}-help"{% if error %} aria-invalid="true"{% endif %}>
{% if type == 'password' %}<button type="button" class="au-pw-toggle" data-au-toggle="{{ id }}" aria-label="Show password" aria-pressed="false"><svg class="au-ic" aria-hidden="true"><use href="#au-i-eye-off"/></svg></button>{% endif %}</div>
<div id="{{ id }}-help" class="au-help{% if error %} is-error{% endif %}" aria-live="polite">{% if error %}<svg class="au-ic" aria-hidden="true"><use href="#au-i-alert"/></svg>{{ error }}{% endif %}</div></div>
