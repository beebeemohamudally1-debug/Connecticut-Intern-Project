{# include with: id, name, label, type, value, error, help, autocomplete, placeholder, required, optional, maxlength, inputmode, prefix, live #}
<div class="au-field rg-field"><label class="au-label" for="{{ id }}">{{ label }}{% if required %} <span class="rg-req" aria-hidden="true">*</span>{% endif %}{% if optional %} <span class="rg-opt">(optional)</span>{% endif %}</label>
<div class="au-ctl{% if type == 'password' %} is-password{% endif %}{% if prefix %} has-prefix{% endif %}">{% if prefix %}<span class="rg-prefix" aria-hidden="true">{{ prefix }}</span>{% endif %}<input id="{{ id }}" name="{{ name }}" type="{{ type|default:'text' }}" value="{{ value|default:'' }}" autocomplete="{{ autocomplete|default:'off' }}" placeholder="{{ placeholder|default:'' }}"{% if maxlength %} maxlength="{{ maxlength }}"{% endif %}{% if inputmode %} inputmode="{{ inputmode }}"{% endif %}{% if required %} aria-required="true"{% endif %}{% if live %} data-rg-check-url="{% url 'accounts:username_check' %}"{% endif %} aria-describedby="{{ id }}-help {{ id }}-error"{% if error %} aria-invalid="true"{% endif %}>{% if type == 'password' %}<button type="button" class="au-pw-toggle" data-au-toggle="{{ id }}" aria-label="Show password" aria-pressed="false"><svg class="au-ic" aria-hidden="true"><use href="#au-i-eye-off"/></svg></button>{% endif %}</div>
<div id="{{ id }}-help" class="au-help rg-help">{{ help|default:'' }}</div>
<div id="{{ id }}-error" class="au-help is-error rg-error" aria-live="polite">{% if error %}<svg class="au-ic" aria-hidden="true"><use href="#au-i-alert"/></svg>{{ error }}{% endif %}</div></div>
